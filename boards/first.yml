title: "Orders per week"

queries:
  orders_by_week:
    sql: |
      SELECT date_trunc('week', order_date) AS week,
             COUNT(*) AS orders
      FROM {{ ref('orders') }}
      GROUP BY 1
      ORDER BY 1
    source: jaffle

charts:
  weekly_orders:
    query: orders_by_week
    type: line
    x: week
    y: orders

rows:
  - weekly_orders
